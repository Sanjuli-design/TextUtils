<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Text Utils</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
         <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Text Utils.in</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="#">Home</a>
        </li>
        
        
        
      </ul>
      
    </div>
  
</nav>
<div class="alert alert-success alert-dismissible fade show" role="alert">
  <strong>Welcome to Text Utils!</strong> You can do anything here with your text!
  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>
<div class="container">
    <form action="/analyze" method="post"> {% csrf_token %}
  
  <div class="form-group">
    <label for="exampleFormControlTextarea1">Enter your Text here and let Textutils do the magic!</label>
    <textarea class="form-control" name='text' id="exampleFormControlTextarea1" rows="5"></textarea>
  </div>
  
 

<div class="form-check form-switch">
  <input class="form-check-input" type="checkbox" name="removepunc" role="switch" id="switchCheckDefault">
  <label class="form-check-label" for="switchCheckDefault">Remove Punctuations</label>
</div>
<div class="form-check form-switch">
  <input class="form-check-input" type="checkbox" name="fullcaps" role="switch" id="switchCheckDefault">
  <label class="form-check-label" for="switchCheckDefault">UpperCase</label>
</div>
<div class="form-check form-switch">
  <input class="form-check-input" type="checkbox" name="newlineremove" role="switch" id="switchCheckDefault">
  <label class="form-check-label" for="switchCheckDefault">Remove New Line</label>
</div>
<div class="form-check form-switch">
  <input class="form-check-input" type="checkbox" name="extraspaceremover" role="switch" id="switchCheckDefault">
  <label class="form-check-label" for="switchCheckDefault">Remove Extra Spaces</label>
</div>
<div class="form-check form-switch">
  <input class="form-check-input" type="checkbox" name="charcount" role="switch" id="switchCheckDefault">
  <label class="form-check-label" for="switchCheckDefault">Count Characters</label>
</div>


        
        
        
<button type="submit" class="btn btn-dark mt-3">Analyze Text</button>
</form>
</div>
</div>
  </body>
</html>
